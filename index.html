<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiTanks</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- WebMidi.js library for MIDI input -->
    <script src="https://cdn.jsdelivr.net/npm/webmidi@3.1.0/dist/iife/webmidi.iife.js"></script>

    <!-- Game modules -->
    <script src="js/constants.js"></script>
    <script src="js/pixelFont.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/tilemap.js"></script>
    <script src="js/songs.js"></script>
    <script src="js/audioSystem.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/powerups.js"></script>
    <script src="js/collisions.js"></script>
    <script src="js/abilities.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/story.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/bosses.js"></script>
    <script src="js/modes/modeManager.js"></script>
    <script src="js/modes/ffaMode.js"></script>
    <script src="js/modes/tdmMode.js"></script>
    <script src="js/modes/campaignMode.js"></script>
    <script src="js/midiHandler.js"></script>
    <script src="js/aiBehavior.js"></script>
    <script src="js/game.js"></script>
    <script src="js/overworld.js"></script>
    <script src="js/menu.js"></script>
</head>
<body>
    <!-- Menu and game content will be generated by JavaScript -->

    <script>
        // =============================================================================
        // MAIN APPLICATION INITIALIZATION
        // =============================================================================

        // Initialize the application when the page loads
        window.addEventListener('load', async function() {
            // Wait for the menu font, so that nothing draws in a fallback first
            try {
                await document.fonts.load('20px "Tiny Tanks"');
            } catch (_) {
                // Falls back to the system monospace
            }

            // Initialize audio system
            window.audioSystem.init();

            // Initialize the menu system
            window.menu.initialize();

            // Add keyboard shortcuts
            document.addEventListener('keydown', function(event) {
                // ESC key pauses, and the pause menu has the way out
                if (event.key === 'Escape' && window.game) {
                    event.stopPropagation(); // One press is one thing, it does not also go back a menu
                    window.menu.handleEscape();
                    return;
                }

                // P key to pause/unpause game
                if ((event.key === 'p' || event.key === 'P') && window.game) {
                    window.game.togglePause();
                }

                // M key to toggle audio
                if (event.key === 'm' || event.key === 'M') {
                    window.audioSystem.toggle();
                    window.audioSystem.toggleMusic();
                    window.menu.updateAudioButtonStates();
                }
            });
        });

        // Handle page visibility changes (pause when tab is not active)
        document.addEventListener('visibilitychange', function() {
            if (window.game && document.hidden) {
                window.game.setPaused(true);
            }
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            if (window.game) {
                window.game.handleResize();
            }
            if (window.menu && window.menu.currentScreen === 'home') {
                window.menu.paintTiles();
            }
        });
    </script>
</body>
</html>
